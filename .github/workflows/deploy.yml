name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/actividad-cloud-native
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build y Push de la imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Simular actualización de la imagen en Kubernetes
        run: |
          # Obtiene el tag del sha generado en este commit
          IMAGE_TAG="sha-${{ github.sha }}"
          FULL_IMAGE="${{ secrets.DOCKER_USERNAME }}/actividad-cloud-native:${IMAGE_TAG}"
          
          echo "Actualizando k8s/deployment.yaml con la nueva imagen..."
          
          # Actualizar el archivo yaml usando sed
          sed -i "s|image: .*|image: ${FULL_IMAGE}|g" k8s/deployment.yaml
          
          echo "Resultado de la actualización en el manifiesto k8s/deployment.yaml:"
          cat k8s/deployment.yaml
