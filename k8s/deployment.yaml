apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-microservice
  labels:
    app: cloud-native-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-native-app
  template:
    metadata:
      labels:
        app: cloud-native-app
    spec:
      containers:
      - name: nodejs-app
        # El tag (latest) será reemplazado dinámicamente en el CI/CD usando sed
        image: REPLACE_ME_DOCKER_USER/actividad-cloud-native:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-native-service
spec:
  type: NodePort
  selector:
    app: cloud-native-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
